name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: packages/adapter/package-lock.json

      - name: Check the release version before publishing either artifact
        run: scripts/check-version.sh >> "$GITHUB_ENV"

      - name: Skip the npm publish when the registry already has this version
        run: |
          if npm view "@waniwani/agent-adapter@$VERSION" version >/dev/null 2>&1; then
            echo "NPM_PUBLISHED=true" >> "$GITHUB_ENV"
            echo "::notice::@waniwani/agent-adapter@$VERSION is already on npm, publishing the image only."
          fi

      - run: npm ci --no-audit --no-fund
        working-directory: packages/adapter
      - run: npm run build
        working-directory: packages/adapter
      - name: Validate the npm package without publishing
        run: npm publish --dry-run --provenance --access public --ignore-scripts --tag "$NPM_TAG"
        working-directory: packages/adapter

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the runtime image
        run: |
          docker buildx build eve/ --platform linux/amd64,linux/arm64 \
            --tag "ghcr.io/waniwani-ai/agent:$VERSION" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" --push

      - name: Publish the adapter with npm trusted publishing
        if: env.NPM_PUBLISHED != 'true'
        run: npm publish --provenance --access public --ignore-scripts --tag "$NPM_TAG"
        working-directory: packages/adapter
